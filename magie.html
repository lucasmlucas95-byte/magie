<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>✦ Magie</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel+Decorative:wght@400;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; min-height: 100%;
      background: #080608;
      color: #f5f0e8;
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    /* ── Fond ambiance ── */
    #bg {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse 80% 70% at 50% 50%, #1a0e08 0%, #080608 100%);
    }

    /* ── Cartes flottantes ── */
    .cards-scene {
      position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden;
    }
    .float-card {
      position: absolute;
      border-radius: 8px;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.6));
      animation: cardFloat linear infinite;
    }
    .float-card svg { width: 100%; border-radius: 8px; display: block; }

    @keyframes cardFloat {
      0%   { opacity: 0; transform: translateY(0) rotate(var(--rot)) scale(0.88); }
      12%  { opacity: var(--max-op); }
      85%  { opacity: var(--max-op); }
      100% { opacity: 0; transform: translateY(var(--travel)) rotate(calc(var(--rot) + var(--rotd))) scale(1.05); }
    }

    .float-card:nth-child(1) { left:3%;   top:10%;    width:100px; --rot:-14deg; --rotd:9deg;   --travel:-95px;  --max-op:.45; animation-duration:7s;   animation-delay:0s; }
    .float-card:nth-child(2) { right:4%;  top:15%;    width:120px; --rot:17deg;  --rotd:-11deg; --travel:-110px; --max-op:.40; animation-duration:8.5s; animation-delay:0.5s; }
    .float-card:nth-child(3) { left:10%;  bottom:12%; width:95px;  --rot:8deg;   --rotd:16deg;  --travel:-90px;  --max-op:.38; animation-duration:7.5s; animation-delay:1s; }
    .float-card:nth-child(4) { right:10%; bottom:18%; width:110px; --rot:-11deg; --rotd:-19deg; --travel:-105px; --max-op:.42; animation-duration:9s;   animation-delay:1.3s; }
    .float-card:nth-child(5) { left:25%;  top:5%;     width:85px;  --rot:22deg;  --rotd:-13deg; --travel:-75px;  --max-op:.32; animation-duration:6.5s; animation-delay:0.7s; }
    .float-card:nth-child(6) { right:24%; bottom:6%;  width:100px; --rot:-24deg; --rotd:15deg;  --travel:-100px; --max-op:.38; animation-duration:8s;   animation-delay:0.3s; }
    .float-card:nth-child(7) { left:0%;   bottom:35%; width:80px;  --rot:13deg;  --rotd:-10deg; --travel:-80px;  --max-op:.30; animation-duration:9.5s; animation-delay:1.1s; }
    .float-card:nth-child(8) { right:0%;  top:40%;    width:100px; --rot:-18deg; --rotd:24deg;  --travel:-70px;  --max-op:.36; animation-duration:7.8s; animation-delay:0.6s; }
    .float-card:nth-child(9) { left:48%;  top:3%;     width:88px;  --rot:6deg;   --rotd:-20deg; --travel:-85px;  --max-op:.28; animation-duration:10s;  animation-delay:1.5s; }
    .float-card:nth-child(10){ right:38%; bottom:3%;  width:92px;  --rot:-8deg;  --rotd:18deg;  --travel:-95px;  --max-op:.33; animation-duration:8.2s; animation-delay:0.9s; }

    /* ── Vignette ── */
    #vignette {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 25%, rgba(8,6,8,0.55) 65%, rgba(8,6,8,0.92) 100%);
    }

    /* ── Glow pulsé ── */
    #glow {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(201,168,76,0.07) 0%, transparent 65%);
      animation: pulse 4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }

    /* ── Rayons ── */
    #rays {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      overflow: hidden; opacity: 0.6;
    }
    .ray {
      position: absolute; top: 50%; left: 50%;
      width: 1px; transform-origin: top center;
      background: linear-gradient(to bottom, rgba(201,168,76,0.06), transparent);
      animation: rotateRay var(--dur,20s) linear infinite;
    }
    @keyframes rotateRay {
      from { transform: rotate(var(--start)); }
      to   { transform: rotate(calc(var(--start) + 360deg)); }
    }

    /* ── Scène principale ── */
    #scene {
      position: relative; z-index: 3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
      gap: 2rem;
    }

    /* Ornement titre */
    .ornament {
      font-size: 0.75rem;
      letter-spacing: 0.7em;
      color: rgba(201,168,76,0.8);
      text-transform: uppercase;
      font-weight: 400;
    }

    h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.6rem, 6vw, 2.8rem);
      font-weight: 400;
      color: #f5f0e8;
      text-align: center;
      line-height: 1.2;
      text-shadow: 0 0 60px rgba(201,168,76,0.2);
    }
    h1 em { font-style: italic; color: #c9a84c; font-family: 'Cormorant Garamond', serif; font-size: 1.2em; }

    .divider {
      width: 80px; height: 1px;
      background: linear-gradient(to right, transparent, #c9a84c, transparent);
    }

    .subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1rem, 3vw, 1.3rem);
      font-style: italic;
      color: rgba(245,240,232,0.7);
      text-align: center;
      line-height: 1.7;
    }

    /* ── Bloc code ── */
    #lock-bloc {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.4rem;
      width: 100%;
      max-width: 380px;
    }

    .code-box {
      width: 100%;
      padding: 2rem 2rem 1.8rem;
      border: 1px solid rgba(201,168,76,0.2);
      background: rgba(201,168,76,0.03);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      position: relative;
    }
    .code-box::before, .code-box::after {
      content: '✦';
      position: absolute;
      color: rgba(201,168,76,0.5);
      font-size: 0.7rem;
    }
    .code-box::before { top: -0.5rem; left: 50%; transform: translateX(-50%); background: #080608; padding: 0 0.4rem; }
    .code-box::after  { bottom: -0.5rem; left: 50%; transform: translateX(-50%); background: #080608; padding: 0 0.4rem; }

    .code-label {
      font-size: 0.6rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(201,168,76,0.7);
      font-weight: 500;
      text-align: center;
    }

    .code-input {
      width: 100%;
      padding: 0.8rem 0;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(201,168,76,0.25);
      color: #f5f0e8;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 0.35em;
      text-align: center;
      outline: none;
      transition: border-color 0.3s;
      -webkit-appearance: none;
    }
    .code-input:focus { border-bottom-color: #c9a84c; }
    .code-input::placeholder { color: rgba(245,240,232,0.2); font-size: 1.2rem; letter-spacing: 0.2em; }

    .lock-error {
      font-size: 0.72rem;
      color: #e05555;
      opacity: 0;
      transition: opacity 0.3s;
      letter-spacing: 0.1em;
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
    }
    .lock-error.show { opacity: 1; }

    .unlock-btn {
      width: 100%;
      padding: 1rem 2rem;
      background: transparent;
      border: 1px solid rgba(201,168,76,0.35);
      color: #c9a84c;
      font-family: 'Cinzel Decorative', serif;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      cursor: pointer;
      transition: all 0.3s;
      -webkit-tap-highlight-color: transparent;
    }
    .unlock-btn:hover { background: rgba(201,168,76,0.08); border-color: #c9a84c; }
    .unlock-btn:active { transform: scale(0.98); }

    /* ── Carte révélée ── */
    #reveal-bloc {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      width: 100%;
    }

    .reveal-msg {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.1rem, 3.5vw, 1.5rem);
      font-style: italic;
      color: rgba(245,240,232,0.75);
      text-align: center;
      line-height: 1.8;
    }

    #card-wrap {
      width: min(240px, 62vw);
      aspect-ratio: 63/88;
      position: relative;
      filter: drop-shadow(0 0 50px rgba(201,168,76,0.3)) drop-shadow(0 20px 50px rgba(0,0,0,0.8));
      animation: cardAppear 1s cubic-bezier(0.23,1,0.32,1) both;
    }
    @keyframes cardAppear {
      from { transform: scale(0.7) translateY(30px) rotateY(90deg); opacity: 0; }
      to   { transform: scale(1) translateY(0) rotateY(0deg); opacity: 1; }
    }
    #card-wrap svg { width: 100%; height: 100%; display: block; }

    .reveal-card-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.2rem, 4vw, 1.8rem);
      font-style: italic;
      color: #c9a84c;
      text-align: center;
      letter-spacing: 0.05em;
      text-shadow: 0 0 30px rgba(201,168,76,0.4);
    }

    /* Flash */
    #flash { position: fixed; inset: 0; z-index: 99; background: white; opacity: 0; pointer-events: none; transition: opacity 0.06s; }
    #flash.go { opacity: 0.2; }
  </style>
</head>

  async function tryUnlock() {
    const input = document.getElementById('lock-input').value.trim();
    const error = document.getElementById('lock-error');
    if (!input) return;

    try {
      const res = await fetch(SUPA_URL + '/rest/v1/magie?select=code,carte&limit=1', {
        headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY }
      });
      const data = await res.json();
      if (data && data[0] && input === data[0].code) {
        // Flash
        const flash = document.getElementById('flash');
        flash.classList.add('go');
        setTimeout(() => flash.classList.remove('go'), 120);
        // Révèle
        setTimeout(() => revealCard(data[0].carte), 100);
        error.classList.remove('show');
      } else {
        error.classList.add('show');
        document.getElementById('lock-input').value = '';
      }
    } catch(e) {
      error.textContent = 'Erreur de connexion. Réessayez.';
      error.classList.add('show');
    }
  }

  function revealCard(carte) {
    document.getElementById('lock-bloc').style.display = 'none';
    const revealBloc = document.getElementById('reveal-bloc');
    revealBloc.style.display = 'flex';
    const card = cardsData[carte] || cardsData['as-pique'];
    document.getElementById('card-wrap').innerHTML = card.svg;
    document.getElementById('card-name').textContent = card.name;
  }

  document.getElementById('lock-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') tryUnlock();
  });
</script>
