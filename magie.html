    if (!input) return;
    try {
      const res = await fetch(SUPA_URL+'/rest/v1/magie?select=code,carte&limit=1',{headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}});
      const data = await res.json();
      if (data && data[0] && input === data[0].code) {
        const flash = document.getElementById('flash');
        flash.classList.add('go');
        setTimeout(()=>flash.classList.remove('go'),120);
        setTimeout(()=>revealCard(data[0].carte),100);
        error.classList.remove('show');
      } else {
        error.classList.add('show');
        document.getElementById('lock-input').value='';
      }
    } catch(e) {
      error.textContent='Erreur de connexion. Réessayez.';
      error.classList.add('show');
    }
  }

  function revealCard(carte) {
    document.getElementById('lock-bloc').style.display='none';
    const bloc = document.getElementById('reveal-bloc');
    bloc.style.display='flex';
    const c = CARDS[carte];
    if (!c) return;
    document.getElementById('card-wrap').innerHTML = cardSVG(c.rank, c.suit, c.color);
    document.getElementById('card-name').textContent = c.name;
    document.getElementById('reveal-msg').textContent = 'Votre carte était… le '+c.name+' !';
  }

  function resetPage() {
    document.getElementById('reveal-bloc').style.display='none';
    document.getElementById('lock-bloc').style.display='flex';
    document.getElementById('lock-input').value='';
    document.getElementById('lock-error').classList.remove('show');
  }

  document.getElementById('lock-input').addEventListener('keydown',function(e){if(e.key==='Enter')tryUnlock();});
</script>
</body>
</html>
