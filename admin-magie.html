<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>✦ Admin Magie</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; background: #060608; font-family: 'Cinzel', serif; color: #f5f0e8; touch-action: manipulation; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 1.5rem; gap: 1.8rem; }

    h1 { font-family: 'Cinzel Decorative', serif; font-size: clamp(0.9rem, 4vw, 1.2rem); color: #c9a84c; letter-spacing: 0.2em; text-align: center; text-shadow: 0 0 30px rgba(201,168,76,0.4); }
    .divider { width: 160px; height: 1px; background: linear-gradient(to right, transparent, #c9a84c, transparent); }
    p.sub { font-size: 0.65rem; letter-spacing: 0.25em; color: rgba(201,168,76,0.5); text-transform: uppercase; text-align: center; }

    /* Bloc code */
    .bloc { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 0.6rem; }
    .bloc-label { font-size: 0.6rem; letter-spacing: 0.35em; text-transform: uppercase; color: #c9a84c; font-weight: 600; }
    .bloc-input {
      width: 100%; padding: 0.8rem 1rem;
      background: rgba(201,168,76,0.05);
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 8px;
      color: #f5f0e8;
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      letter-spacing: 0.2em;
      outline: none;
      transition: border-color 0.2s;
      text-align: center;
    }
    .bloc-input:focus { border-color: #c9a84c; }
    .bloc-hint { font-size: 0.58rem; color: rgba(201,168,76,0.45); letter-spacing: 0.2em; text-align: center; }

    /* Grille cartes */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; width: 100%; max-width: 360px; }
    .card-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.35rem; padding: 1rem 0.6rem;
      border-radius: 10px; border: 2px solid rgba(201,168,76,0.2);
      background: rgba(201,168,76,0.03);
      cursor: pointer; transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .card-btn:active { transform: scale(0.97); }
    .card-btn.active { background: rgba(201,168,76,0.15); border-color: #c9a84c; box-shadow: 0 0 20px rgba(201,168,76,0.2); }
    .card-btn .pip { font-size: 1.8rem; line-height: 1; }
    .card-btn .name { font-size: 0.58rem; letter-spacing: 0.12em; text-transform: uppercase; text-align: center; color: rgba(245,240,232,0.75); }
    .card-btn.active .name { color: #c9a84c; }
    .red-pip { color: #e05050; }
    .black-pip { color: #e8e0d0; }

    /* Bouton save */
    .save-btn {
      width: 100%; max-width: 360px;
      padding: 0.9rem;
      background: #c9a84c;
      border: none;
      border-radius: 8px;
      color: #060608;
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      font-weight: 600;
    }
    .save-btn:hover { background: #e2c47a; }
    .save-btn:active { transform: scale(0.98); }
    .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #status { font-size: 0.68rem; letter-spacing: 0.2em; text-align: center; min-height: 1rem; transition: color 0.3s; }
    #status.ok { color: #4caf50; }
    #status.err { color: #f44336; }
    #status.loading { color: rgba(201,168,76,0.6); }

    #active-display { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; }
    #active-display .label { font-size: 0.55rem; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(201,168,76,0.45); }
    #active-display .value { font-family: 'Cinzel Decorative', serif; font-size: 0.9rem; color: #c9a84c; text-align: center; }
  </style>
</head>
<body>

  <h1>✦ Admin Tour de Magie ✦</h1>
  <div class="divider"></div>
  <p class="sub">Configurez le tour avant le spectacle</p>

  <!-- Code spectateur -->
  <div class="bloc">
    <div class="bloc-label">Code du spectateur (date de naissance)</div>
    <input type="text" class="bloc-input" id="code-input" placeholder="ex: 15031995" maxlength="20"/>
    <div class="bloc-hint">Format libre — tapez exactement ce que le spectateur devra entrer</div>
  </div>

  <div class="divider"></div>
  <p class="sub">Carte à révéler</p>

  <!-- Sélection carte -->
  <div class="grid">
    <button class="card-btn" id="btn-3-carreau" onclick="selectCard('3-carreau')">
      <span class="pip red-pip">♦</span><span class="name">3 de Carreau</span>
    </button>
    <button class="card-btn" id="btn-7-trefle" onclick="selectCard('7-trefle')">
      <span class="pip black-pip">♣</span><span class="name">7 de Trèfle</span>
    </button>
    <button class="card-btn" id="btn-valet-coeur" onclick="selectCard('valet-coeur')">
      <span class="pip red-pip">♥</span><span class="name">Valet de Cœur</span>
    </button>
    <button class="card-btn" id="btn-10-pique" onclick="selectCard('10-pique')">
      <span class="pip black-pip">♠</span><span class="name">10 de Pique</span>
    </button>
    <button class="card-btn" id="btn-as-pique" onclick="selectCard('as-pique')">
      <span class="pip black-pip">♠</span><span class="name">As de Pique</span>
    </button>
    <button class="card-btn" id="btn-as-coeur" onclick="selectCard('as-coeur')">
      <span class="pip red-pip">♥</span><span class="name">As de Cœur</span>
    </button>
  </div>

  <button class="save-btn" id="save-btn" onclick="save()">✦ Enregistrer le tour ✦</button>

  <div id="active-display">
    <div class="label">Configuration actuelle</div>
    <div class="value" id="active-value">Chargement...</div>
  </div>

  <div id="status" class="loading">Connexion...</div>

  <script>
    const URL = 'https://dfxnaazkbcrvltlcbtsh.supabase.co';
    const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmeG5hYXprYmNydmx0bGNidHNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwOTIxNDAsImV4cCI6MjA5MDY2ODE0MH0.I1rlwrHSwjEnk82v8Ac-vEBofdMUyUGFTnYTepYGuFw';

    const names = {
      '3-carreau':  '♦ 3 de Carreau',
      '7-trefle':   '♣ 7 de Trèfle',
      'valet-coeur':'♥ Valet de Cœur',
      '10-pique':   '♠ 10 de Pique',
      'as-pique':   '♠ As de Pique',
      'as-coeur':   '♥ As de Cœur'
    };

    let selectedCard = null;

    function selectCard(carte) {
      document.querySelectorAll('.card-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-' + carte).classList.add('active');
      selectedCard = carte;
    }

    function setDisplay(code, carte) {
      document.getElementById('active-value').textContent =
        'Code : ' + code + '  |  Carte : ' + (names[carte] || carte);
    }

    async function load() {
      try {
        const res = await fetch(URL + '/rest/v1/magie?select=code,carte&limit=1', {
          headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY }
        });
        const data = await res.json();
        if (data && data[0]) {
          document.getElementById('code-input').value = data[0].code;
          selectCard(data[0].carte);
          setDisplay(data[0].code, data[0].carte);
        }
        document.getElementById('status').textContent = '✦ Prêt';
        document.getElementById('status').className = 'ok';
      } catch(e) {
        document.getElementById('status').textContent = 'Erreur connexion';
        document.getElementById('status').className = 'err';
      }
    }

    async function save() {
      const code = document.getElementById('code-input').value.trim();
      if (!code) { alert('Entrez un code.'); return; }
      if (!selectedCard) { alert('Choisissez une carte.'); return; }

      const btn = document.getElementById('save-btn');
      btn.disabled = true;
      btn.textContent = 'Enregistrement...';
      document.getElementById('status').textContent = 'Mise à jour...';
      document.getElementById('status').className = 'loading';

      try {
        const res = await fetch(URL + '/rest/v1/magie?id=gte.0', {
          method: 'PATCH',
          headers: {
            'apikey': KEY,
            'Authorization': 'Bearer ' + KEY,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({ code, carte: selectedCard })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        setDisplay(code, selectedCard);
        document.getElementById('status').textContent = '✦ Tour configuré !';
        document.getElementById('status').className = 'ok';
      } catch(e) {
        document.getElementById('status').textContent = 'Erreur : ' + e.message;
        document.getElementById('status').className = 'err';
      } finally {
        btn.disabled = false;
        btn.textContent = '✦ Enregistrer le tour ✦';
      }
    }

    load();
  </script>
</body>
</html>
