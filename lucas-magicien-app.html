<title>Lucas Magicien</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#c9a84c;--gold-l:#e8c96a;--gold-d:#a07828;
  --gold-bg:rgba(201,168,76,0.1);--gold-border:rgba(201,168,76,0.3);
  --bg:#0f0d0a;--bg2:#1a1710;--bg3:#231f14;
  --card:#1e1b12;--card2:#252018;
  --t:#f0e8d5;--t2:rgba(240,232,213,0.72);--t3:rgba(240,232,213,0.42);
  --border:rgba(201,168,76,0.15);
}
:root[data-theme="light"]{
  --gold:#8a6010;--gold-l:#a07828;--gold-d:#6a4808;
  --gold-bg:rgba(138,96,16,0.08);--gold-border:rgba(138,96,16,0.25);
  --bg:#faf7f2;--bg2:#f0ebe0;--bg3:#e8e0d0;
  --card:#ffffff;--card2:#f5f0e8;
  --t:#1a1508;--t2:rgba(26,21,8,0.7);--t3:rgba(26,21,8,0.42);
  --border:rgba(138,96,16,0.15);
  --radius:16px;--radm:10px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
  --c-mariage:#c47ed4;--c-mariage-bg:rgba(196,126,212,0.12);--c-mariage-bd:rgba(196,126,212,0.3);
  --c-corporate:#7ab4e8;--c-corporate-bg:rgba(122,180,232,0.12);--c-corporate-bd:rgba(122,180,232,0.3);
  --c-enfants:#e8a84c;--c-enfants-bg:rgba(232,168,76,0.12);--c-enfants-bd:rgba(232,168,76,0.3);
  --c-prive:#6ed4a0;--c-prive-bg:rgba(110,212,160,0.12);--c-prive-bd:rgba(110,212,160,0.3);
  --c-autre:#a0a090;--c-autre-bg:rgba(160,160,144,0.12);--c-autre-bd:rgba(160,160,144,0.3);
}
html,body{transition:background 0.3s,color 0.3s}
.theme-btn{background:var(--bg2);border:0.5px solid var(--border);border-radius:20px;padding:4px 10px;font-size:13px;cursor:pointer;color:var(--t2);-webkit-tap-highlight-color:transparent;transition:all 0.2s;flex-shrink:0}
.theme-btn:active{opacity:0.7}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;-webkit-text-size-adjust:100%}
.app{display:flex;flex-direction:column;height:100%;padding-top:var(--safe-top)}

/* HEADER */
.app-header{padding:1rem 1.1rem 0.65rem;border-bottom:0.5px solid var(--border);background:var(--bg);flex-shrink:0}
.app-header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.65rem}
.app-logo{font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
.app-date{font-size:11px;color:var(--t3)}

/* MENU HAMBURGER */
.hamburger{background:none;border:0.5px solid var(--border);border-radius:var(--radm);width:36px;height:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;flex-shrink:0;-webkit-tap-highlight-color:transparent;transition:background 0.2s}
.hamburger:active{background:var(--bg2)}
.hamburger span{display:block;height:1.5px;background:var(--gold);border-radius:1px;transition:all 0.28s ease}
.hamburger span:nth-child(1){width:18px}
.hamburger span:nth-child(2){width:13px}
.hamburger span:nth-child(3){width:18px}
.hamburger.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg);width:18px}
.hamburger.open span:nth-child(2){opacity:0;transform:scaleX(0)}
.hamburger.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);width:18px}

.nav-overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0);pointer-events:none;transition:background 0.3s}
.nav-overlay.open{background:rgba(0,0,0,0.5);pointer-events:all}
.nav-panel{position:fixed;top:0;left:0;bottom:0;width:72vw;max-width:260px;z-index:60;background:var(--bg2);border-right:0.5px solid var(--border);display:flex;flex-direction:column;padding:calc(var(--safe-top) + 1.5rem) 0 calc(1.5rem + var(--safe-bot));transform:translateX(-100%);transition:transform 0.32s cubic-bezier(0.4,0,0.2,1)}
.nav-panel.open{transform:translateX(0)}
.nav-panel-logo{font-size:10px;letter-spacing:0.25em;text-transform:uppercase;color:var(--gold);font-weight:600;padding:0 1.3rem 1.5rem;border-bottom:0.5px solid var(--border);margin-bottom:0.5rem}
.nav-item{display:flex;align-items:center;gap:0.9rem;padding:0.85rem 1.3rem;font-size:15px;font-weight:500;color:var(--t2);cursor:pointer;border:none;background:none;width:100%;text-align:left;-webkit-tap-highlight-color:transparent;transition:all 0.18s;border-left:3px solid transparent}
.nav-item:active{background:var(--bg3)}
.nav-item.active{color:var(--gold);border-left-color:var(--gold);background:var(--gold-bg)}
.nav-item-icon{font-size:16px;width:22px;text-align:center;flex-shrink:0}
.nav-sep{height:0.5px;background:var(--border);margin:0.5rem 1.3rem}
.nav-panel-foot{margin-top:auto;padding:1rem 1.3rem 0;font-size:10px;color:var(--t3);letter-spacing:0.1em;text-transform:uppercase}

/* SCREEN TITLE */
.screen-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.screen-title{font-size:18px;font-weight:600;color:var(--t)}

/* SCREENS */
.screens{flex:1;overflow:hidden;position:relative}
.screen{display:none;height:100%;overflow-y:auto;padding:1rem 1rem calc(1rem + var(--safe-bot));-webkit-overflow-scrolling:touch}
.screen.active{display:block}
.sec-label{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--t3);margin-bottom:0.7rem;font-weight:600}

/* TYPE TAGS */
.type-tag{display:inline-flex;align-items:center;font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;letter-spacing:0.06em}
.tag-mariage{background:var(--c-mariage-bg);color:var(--c-mariage);border:0.5px solid var(--c-mariage-bd)}
.tag-corporate{background:var(--c-corporate-bg);color:var(--c-corporate);border:0.5px solid var(--c-corporate-bd)}
.tag-enfants{background:var(--c-enfants-bg);color:var(--c-enfants);border:0.5px solid var(--c-enfants-bd)}
.tag-prive{background:var(--c-prive-bg);color:var(--c-prive);border:0.5px solid var(--c-prive-bd)}
.tag-autre{background:var(--c-autre-bg);color:var(--c-autre);border:0.5px solid var(--c-autre-bd)}

/* HERO CARD */
.next-hero{border-radius:var(--radius);padding:1.1rem;margin-bottom:1rem;border:1px solid;position:relative}
.next-hero-lbl{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;opacity:0.6;margin-bottom:0.35rem;font-weight:600}
.next-hero-name{font-size:22px;font-weight:600;margin-bottom:0.25rem;line-height:1.2;color:var(--t)}
.next-hero-date{font-size:12px;color:var(--t2);margin-bottom:0.7rem}
.next-hero-row{display:flex;align-items:center;gap:7px;margin-bottom:0.8rem;flex-wrap:wrap}
.countdown{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px}
.prep-block{border-top:0.5px solid;padding-top:0.8rem}
.prep-lbl{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;opacity:0.6;margin-bottom:0.5rem;font-weight:600}
.prep-item{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--t2);line-height:1.45;margin-bottom:4px}
.prep-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0;margin-top:5px;background:currentColor;opacity:0.6}
.hero-actions{display:flex;gap:8px;margin-top:0.9rem}
.hero-btn{flex:1;padding:9px 6px;border-radius:var(--radm);font-size:11px;font-weight:600;cursor:pointer;text-align:center;border:0.5px solid;-webkit-tap-highlight-color:transparent;transition:opacity 0.15s;letter-spacing:0.05em}
.hero-btn:active{opacity:0.7}

/* EVENT CARDS */
.event-card{background:var(--card);border:0.5px solid var(--border);border-radius:var(--radius);padding:0.85rem 1rem;margin-bottom:0.6rem;border-left-width:3px;border-left-style:solid;-webkit-tap-highlight-color:transparent}
.event-card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px}
.event-card-name{font-size:14px;font-weight:500;color:var(--t)}
.event-card-date{font-size:11px;color:var(--t3);margin-bottom:6px}
.event-card-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.days-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;background:var(--bg3);color:var(--t3)}
.days-badge.urgent{background:rgba(220,60,60,0.15);color:#e07070}
.days-badge.soon{background:rgba(232,168,76,0.15);color:var(--c-enfants)}

.add-btn{width:100%;padding:0.8rem;border:0.5px dashed var(--gold-border);background:var(--gold-bg);border-radius:var(--radius);font-size:13px;color:var(--gold);cursor:pointer;font-weight:600;letter-spacing:0.05em;margin-top:0.5rem;-webkit-tap-highlight-color:transparent}
.add-btn:active{opacity:0.7}

/* STATUS */
.badge-ok{font-size:10px;padding:2px 7px;border-radius:20px;background:rgba(80,180,100,0.15);color:#70d080;font-weight:600}
.badge-opt{font-size:10px;padding:2px 7px;border-radius:20px;background:rgba(232,168,76,0.15);color:var(--c-enfants);font-weight:600}

/* CALENDAR */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.cal-nav-btn{background:var(--card);border:0.5px solid var(--border);border-radius:var(--radm);width:34px;height:34px;cursor:pointer;color:var(--t2);font-size:18px;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.cal-month{font-size:15px;font-weight:600;color:var(--t)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:1rem}
.cal-dlbl{font-size:10px;color:var(--t3);text-align:center;padding:4px 0;font-weight:600}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;border-radius:50%;cursor:pointer;color:var(--t3);position:relative;-webkit-tap-highlight-color:transparent}
.cal-day.inm{color:var(--t2)}
.cal-day.today{background:var(--gold-bg);color:var(--gold);font-weight:600;border:0.5px solid var(--gold-border)}
.cal-day.sel{background:var(--gold);color:#0d0b08;font-weight:700}
.cal-day .dots{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.cal-day .dots span{width:4px;height:4px;border-radius:50%;display:block}
.cal-day.sel .dots span{background:#0d0b08!important}
.cal-events{border-top:0.5px solid var(--border);padding-top:0.9rem}
.cal-ev{display:flex;align-items:center;gap:9px;padding:0.6rem 0;border-bottom:0.5px solid var(--border)}
.cal-ev:last-child{border-bottom:none}
.cal-ev-bar{width:3px;height:40px;border-radius:2px;flex-shrink:0}
.cal-ev-name{font-size:13px;font-weight:500;color:var(--t)}
.cal-ev-sub{font-size:11px;color:var(--t3);margin-top:2px}
.cal-empty{font-size:12px;color:var(--t3);padding:1.2rem 0;text-align:center}

/* FICHES */
.fiche{background:var(--card);border:0.5px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:0.8rem}
.fiche-hd{padding:0.85rem 1rem 0.7rem;border-bottom:0.5px solid var(--border);border-left:4px solid}
.fiche-name{font-size:15px;font-weight:600;color:var(--t);margin:5px 0 2px}
.fiche-date{font-size:11px;color:var(--t3)}
.fiche-body{padding:0.8rem 1rem}
.fiche-row{display:flex;align-items:flex-start;gap:9px;padding:5px 0;border-bottom:0.5px solid var(--border)}
.fiche-row:last-child{border-bottom:none}
.fiche-k{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--t3);width:68px;flex-shrink:0;padding-top:1px;font-weight:600}
.fiche-v{font-size:12px;color:var(--t2);flex:1;line-height:1.5}
.fiche-ft{padding:0.7rem 1rem;background:var(--card2);display:flex;gap:7px}
.fiche-btn{flex:1;padding:8px 4px;border:0.5px solid var(--border);border-radius:var(--radm);background:none;font-size:11px;color:var(--t2);cursor:pointer;text-align:center;font-weight:600;-webkit-tap-highlight-color:transparent}
.fiche-btn:active{opacity:0.7}
.fiche-btn.ics{background:var(--gold-bg);color:var(--gold);border-color:var(--gold-border)}

/* SETLISTS */
.sl-card{background:var(--card);border:0.5px solid var(--border);border-radius:var(--radius);padding:0.9rem 1rem;margin-bottom:0.75rem}
.sl-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.7rem}
.sl-count{font-size:11px;color:var(--t3)}
.sl-item{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:0.5px solid var(--border);font-size:13px;color:var(--t2)}
.sl-item:last-child{border-bottom:none}
.sl-num{font-size:10px;color:var(--t3);width:18px;text-align:right;flex-shrink:0;font-weight:600}

/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.modal-ov.open{display:flex}
.modal{background:var(--bg2);border-radius:20px 20px 0 0;padding:1.2rem 1rem calc(1.5rem + var(--safe-bot));width:100%;max-height:90vh;overflow-y:auto;border-top:0.5px solid var(--gold-border)}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 1.1rem}
.modal-title{font-size:17px;font-weight:600;margin-bottom:1.1rem;color:var(--t);letter-spacing:0.02em}
.form-group{margin-bottom:0.9rem}
.form-label{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--t3);margin-bottom:5px;display:block;font-weight:600}
.form-input,.form-select,.form-textarea{width:100%;padding:10px 12px;font-size:14px;border:0.5px solid var(--border);border-radius:var(--radm);background:var(--card);color:var(--t);font-family:inherit;-webkit-appearance:none}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--gold-border)}
.form-textarea{min-height:72px;resize:none}
.form-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.type-picker{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.type-opt{padding:10px 6px;border:1px solid var(--border);border-radius:var(--radm);font-size:12px;font-weight:600;cursor:pointer;text-align:center;background:none;color:var(--t3);transition:all 0.2s;-webkit-tap-highlight-color:transparent}
.type-opt.sel-mariage{border-color:var(--c-mariage-bd);background:var(--c-mariage-bg);color:var(--c-mariage)}
.type-opt.sel-corporate{border-color:var(--c-corporate-bd);background:var(--c-corporate-bg);color:var(--c-corporate)}
.type-opt.sel-enfants{border-color:var(--c-enfants-bd);background:var(--c-enfants-bg);color:var(--c-enfants)}
.type-opt.sel-prive{border-color:var(--c-prive-bd);background:var(--c-prive-bg);color:var(--c-prive)}
.type-opt.sel-autre{border-color:var(--c-autre-bd);background:var(--c-autre-bg);color:var(--c-autre)}
.modal-submit{width:100%;padding:14px;background:var(--gold);color:#0d0b08;border:none;border-radius:var(--radm);font-size:15px;font-weight:700;cursor:pointer;margin-top:0.5rem;letter-spacing:0.05em;-webkit-tap-highlight-color:transparent}
.modal-submit:active{opacity:0.85}
</style>
</head>
<body>
<div class="nav-overlay" id="nav-overlay" onclick="closeNav()"></div>
<div class="nav-panel" id="nav-panel">
  <div class="nav-panel-logo">✦ Lucas Magicien</div>
  <button class="nav-item active" id="nav-dashboard" onclick="switchTab('dashboard',this)"><span class="nav-item-icon">🏠</span>Accueil</button>
  <button class="nav-item" id="nav-agenda" onclick="switchTab('agenda',this)"><span class="nav-item-icon">📅</span>Agenda</button>

  <div class="nav-panel-foot">Magie close-up · Île-de-France</div>
</div>

<div class="app">
  <div class="app-header">
    <div class="app-header-top">
      <button class="hamburger" id="hamburger" onclick="toggleNav()">
        <span></span><span></span><span></span>
      </button>
      <span class="app-logo">✦ Lucas Magicien</span>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="theme-btn" id="theme-btn" onclick="toggleTheme()">☀️</button>
        <span class="app-date" id="today-date"></span>
      </div>
    </div>
  </div>

  <div class="screens">
    <div id="screen-dashboard" class="screen active">
      <div class="screen-header"><span class="screen-title">Accueil</span></div>
      <div id="next-hero-wrap"></div>
      <p class="sec-label" style="margin-top:0.3rem">À venir</p>
      <div id="upcoming-list"></div>
      <button class="add-btn" onclick="openModal()">✦ Nouvelle prestation</button>
    </div>

    <div id="screen-agenda" class="screen">

      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="prevMonth()">‹</button>
        <span class="cal-month" id="cal-label"></span>
        <button class="cal-nav-btn" onclick="nextMonth()">›</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="cal-events" id="cal-events"></div>
    </div>

    <div id="screen-fiches" class="screen">
      <div class="screen-header"><span class="screen-title">Prestations</span></div>
      <div id="fiches-list"></div>
      <button class="add-btn" onclick="openModal()">✦ Nouvelle prestation</button>
    </div>

    <div id="screen-setlists" class="screen">
      <div class="screen-header"><span class="screen-title">Setlists</span></div>
      <div id="setlists-wrap"></div>
    </div>
  </div>
</div>

<div class="modal-ov" id="modal-ov" onclick="overlayClick(event)">
  <div class="modal" id="modal-inner"></div>
</div>
<script>
var TYPES={
  mariage:{label:'Mariage',color:'#c47ed4',cls:'mariage',
    attentes:['Discrétion absolue pendant la cérémonie','Close-up au vin d\'honneur','Moments forts mémorables pour les mariés','Adaptabilité au timing du traiteur'],
    setlist:['Disparition bague / alliance','Carte signée dans citron','Mentalisme couple','Monte Carlo','Pièce à travers la main','Floating Card']},
  corporate:{label:'Corporate',color:'#7ab4e8',cls:'corporate',
    attentes:['Image professionnelle et soignée','Brise-glace entre collègues','Effets visuels forts et mémorables','Timing précis entre les discours'],
    setlist:['Prédiction sous enveloppe','Sélection de carte mentale','Billet signé dans orange','Monte Carlo','Floating Card']},
  enfants:{label:'Enfants',color:'#e8a84c',cls:'enfants',
    attentes:['Participation active des enfants','Humour et énergie ++','Tours visuels et colorés','Éviter objets tranchants'],
    setlist:['Foulard magique multi-couleurs','Pièce derrière l\'oreille','Carte choisie retrouvée','Lapin en origami','Baguette farceuse']},
  prive:{label:'Privé',color:'#6ed4a0',cls:'prive',
    attentes:['Ambiance conviviale et détendue','Close-up de table pendant le dîner','Personnalisation avec les convives','Adaptabilité à l\'ambiance'],
    setlist:['Monte Carlo','Carte signée','Mentalisme simple','Floating Card','Pièce à travers la main']},
  autre:{label:'Autre',color:'#a0a090',cls:'autre',
    attentes:['Confirmer les attentes avec le client','Adapter le programme selon le contexte'],
    setlist:['Tour de carte classique','Mentalisme','Manipulation pièce','Floating Card']}
};

var STORAGE_KEY='lucas_events_v1';
var TOURS_KEY='lucas_tours_v1';
var events=[];
var myTours=[];
try{var s=localStorage.getItem(STORAGE_KEY);if(s)events=JSON.parse(s);}catch(e){}
try{var t=localStorage.getItem(TOURS_KEY);if(t)myTours=JSON.parse(t);}catch(e){}

// Thème
var isDark=true;
try{var th=localStorage.getItem('lucas_theme');if(th)isDark=(th==='dark');}catch(e){}
function applyTheme(){
  document.documentElement.setAttribute('data-theme',isDark?'dark':'light');
  var btn=document.getElementById('theme-btn');
  if(btn)btn.textContent=isDark?'☀️':'🌙';
  try{localStorage.setItem('lucas_theme',isDark?'dark':'light');}catch(e){}
}
function toggleTheme(){isDark=!isDark;applyTheme();}
applyTheme();
if(!events.length){
  save();
}

function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(events));}catch(e){}}
function saveTours(){try{localStorage.setItem(TOURS_KEY,JSON.stringify(myTours));}catch(e){}}

var calY=new Date().getFullYear(),calM=new Date().getMonth(),selDay=null;
var MONTHS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
var DAYS=['L','M','M','J','V','S','D'];

document.getElementById('today-date').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});

function typeColor(t){return(TYPES[t]||TYPES.autre).color;}
function typeCls(t){return(TYPES[t]||TYPES.autre).cls;}
function typeLabel(t){return(TYPES[t]||TYPES.autre).label;}
function typeTag(t){return '<span class="type-tag tag-'+typeCls(t)+'">'+typeLabel(t)+'</span>';}
function statusBadge(s){return s==='confirmé'?'<span class="badge-ok">Confirmé</span>':'<span class="badge-opt">Option</span>';}

function daysUntil(ds){var d=new Date(ds),t=new Date();t.setHours(0,0,0,0);d.setHours(0,0,0,0);return Math.round((d-t)/86400000);}
function daysLabel(n){
  if(n<0)return'<span class="days-badge">Passé</span>';
  if(n===0)return'<span class="days-badge urgent">Aujourd\'hui !</span>';
  if(n===1)return'<span class="days-badge urgent">Demain !</span>';
  if(n<=7)return'<span class="days-badge soon">Dans '+n+' j</span>';
  return'<span class="days-badge">Dans '+n+' j</span>';
}

function toggleNav(){
  var h=document.getElementById('hamburger');
  var p=document.getElementById('nav-panel');
  var o=document.getElementById('nav-overlay');
  h.classList.toggle('open');p.classList.toggle('open');o.classList.toggle('open');
}
function closeNav(){
  document.getElementById('hamburger').classList.remove('open');
  document.getElementById('nav-panel').classList.remove('open');
  document.getElementById('nav-overlay').classList.remove('open');
}

function switchTab(name,btn){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  document.querySelectorAll('.nav-item').forEach(function(t){t.classList.remove('active');});
  document.getElementById('screen-'+name).classList.add('active');
  if(btn)btn.classList.add('active');
  closeNav();
  if(name==='dashboard')renderDashboard();
  if(name==='agenda')renderCalendar();
  if(name==='fiches')renderFiches();
  if(name==='setlists')renderSetlists();
}

function renderDashboard(){
  var today=new Date();today.setHours(0,0,0,0);
  var up=events.filter(function(e){var d=new Date(e.date);d.setHours(0,0,0,0);return d>=today;}).sort(function(a,b){return new Date(a.date)-new Date(b.date);});
  var hw=document.getElementById('next-hero-wrap');
  if(!up.length){hw.innerHTML='<div style="text-align:center;padding:2rem;color:var(--t3);font-size:13px">Aucune prestation à venir</div>';document.getElementById('upcoming-list').innerHTML='';return;}
  var e=up[0],T=TYPES[e.type]||TYPES.autre,n=daysUntil(e.date);
  var ctxt=n===0?'Aujourd\'hui !':n===1?'Demain !':'Dans '+n+' jour'+(n>1?'s':'');
  var dateStr=new Date(e.date).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  var prepHtml=T.attentes.slice(0,3).map(function(a){return'<div class="prep-item"><span class="prep-dot" style="color:'+T.color+'"></span><span>'+a+'</span></div>';}).join('');
  hw.innerHTML='<div class="next-hero" style="background:'+T.color+'15;border-color:'+T.color+'40">'
    +'<div class="next-hero-lbl" style="color:'+T.color+'">Prochaine prestation</div>'
    +'<div class="next-hero-name">'+e.name+'</div>'
    +'<div class="next-hero-date">'+dateStr+' · '+e.lieu+' · '+e.duree+'</div>'
    +'<div class="next-hero-row">'+typeTag(e.type)+statusBadge(e.status)
    +'<span class="countdown" style="background:'+T.color+'20;color:'+T.color+'">'+ctxt+'</span></div>'
    +'<div class="prep-block" style="border-color:'+T.color+'25">'
    +'<div class="prep-lbl" style="color:'+T.color+'">Ce que le client attend</div>'
    +prepHtml+'</div>'
    +'<div class="hero-actions">'
    +'<button class="hero-btn" style="background:'+T.color+'18;color:'+T.color+';border-color:'+T.color+'40" onclick="exportICS('+e.id+')">📅 Agenda Apple</button>'
    +'<button class="hero-btn" style="background:var(--card);color:var(--t2);border-color:var(--border)" onclick="callContact(\''+e.tel+'\')">✆ '+e.contact+'</button>'
    +'</div></div>';
  var ul=document.getElementById('upcoming-list');ul.innerHTML='';
  up.slice(1).forEach(function(e){
    var c=typeColor(e.type),d=new Date(e.date).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
    ul.innerHTML+='<div class="event-card" style="border-left-color:'+c+'">'
      +'<div class="event-card-top"><span class="event-card-name">'+e.name+'</span>'+daysLabel(daysUntil(e.date))+'</div>'
      +'<div class="event-card-date">'+d+' · '+e.duree+'</div>'
      +'<div class="event-card-meta">'+typeTag(e.type)+'<span style="font-size:11px;color:var(--t3)">'+e.lieu+'</span></div>'
      +'</div>';
  });
}

function renderFiches(){
  var el=document.getElementById('fiches-list');
  var sorted=events.slice().sort(function(a,b){return new Date(a.date)-new Date(b.date);});
  el.innerHTML='';
  sorted.forEach(function(e){
    var c=typeColor(e.type),T=TYPES[e.type]||TYPES.autre;
    var d=new Date(e.date).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'long',year:'numeric'});
    el.innerHTML+='<div class="fiche">'
      +'<div class="fiche-hd" style="border-left-color:'+c+'">'
      +'<div style="display:flex;gap:7px;align-items:center">'+typeTag(e.type)+statusBadge(e.status)+'</div>'
      +'<div class="fiche-name">'+e.name+'</div><div class="fiche-date">'+d+'</div></div>'
      +'<div class="fiche-body">'
      +'<div class="fiche-row"><span class="fiche-k">Lieu</span><span class="fiche-v">'+e.lieu+'</span></div>'
      +'<div class="fiche-row"><span class="fiche-k">Durée</span><span class="fiche-v">'+e.duree+'</span></div>'
      +'<div class="fiche-row"><span class="fiche-k">Contact</span><span class="fiche-v">'+e.contact+(e.tel?' · '+e.tel:'')+'</span></div>'
      +(e.notes?'<div class="fiche-row"><span class="fiche-k">Notes</span><span class="fiche-v">'+e.notes+'</span></div>':'')
      +'<div class="fiche-row"><span class="fiche-k">Attentes</span><span class="fiche-v">'+T.attentes.slice(0,2).join(' · ')+'</span></div>'
      +(e.setlist&&e.setlist.length?'<div class="fiche-row"><span class="fiche-k">Setlist</span><span class="fiche-v">'+e.setlist.map(function(s,i){return(i+1)+'. '+s;}).join(' · ')+'</span></div>':'')
      +'</div>'
      +'<div class="fiche-ft">'
      +'<button class="fiche-btn ics" onclick="exportICS('+e.id+')">📅 Agenda</button>'
      +'<button class="fiche-btn" onclick="callContact(\''+e.tel+'\')">✆ Appeler</button>'
      +'<button class="fiche-btn" onclick="switchTab(\'setlists\',document.querySelectorAll(\'.tab\')[3])">♠ Setlist</button>'
      +'<button class="fiche-btn" style="color:#e07070;border-color:rgba(220,60,60,0.3)" onclick="deleteEvent('+e.id+')">✕</button>'
      +'</div></div>';
  });
}

function deleteEvent(id){
  if(!confirm('Supprimer cette prestation ?'))return;
  events=events.filter(function(e){return e.id!==id;});
  save();renderFiches();renderDashboard();
}

function renderSetlists(){
  var el=document.getElementById('setlists-wrap');
  el.innerHTML='';

  // Bloc bibliothèque de tours
  el.innerHTML+='<p class="sec-label">Ma bibliothèque de tours</p>'
    +'<div style="display:flex;gap:7px;margin-bottom:8px">'
    +'<input class="form-input" id="new-tour-input" placeholder="Nom du tour (ex: Monte Carlo)..." style="flex:1"/>'
    +'<button onclick="addTourLib()" style="padding:0 14px;background:var(--gold-bg);border:0.5px solid var(--gold-border);border-radius:var(--radm);color:var(--gold);font-size:18px;cursor:pointer;flex-shrink:0">+</button>'
    +'</div>'
    +'<div id="tours-lib"></div>'
    +'<div style="height:0.5px;background:var(--border);margin:1.2rem 0"></div>';

  renderToursLib();

  // Setlists par prestation
  el.innerHTML+='<p class="sec-label">Setlists par prestation</p>';
  var withSetlist=events.filter(function(e){return e.setlist&&e.setlist.length>0;}).sort(function(a,b){return new Date(a.date)-new Date(b.date);});
  if(!withSetlist.length){
    el.innerHTML+='<div style="font-size:12px;color:var(--t3);padding:0.5rem 0 1rem">Aucune setlist enregistrée sur vos prestations.</div>';
  } else {
    withSetlist.forEach(function(e){
      var d=new Date(e.date).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});
      el.innerHTML+='<div class="sl-card">'
        +'<div class="sl-header" style="margin-bottom:0.5rem">'
        +'<div><div style="font-size:14px;font-weight:600;color:var(--t)">'+e.name+'</div>'
        +'<div style="font-size:11px;color:var(--t3);margin-top:2px">'+d+' · '+e.lieu+'</div></div>'
        +typeTag(e.type)+'</div>'
        +'<div style="height:0.5px;background:var(--border);margin-bottom:0.6rem"></div>'
        +e.setlist.map(function(s,i){return'<div class="sl-item"><span class="sl-num">'+(i+1)+'</span><span>'+s+'</span></div>';}).join('')
        +'</div>';
    });
  }
}

function renderToursLib(){
  var el=document.getElementById('tours-lib');
  if(!el)return;
  // Migration : convertir anciens strings en objets
  myTours=myTours.map(function(t){return typeof t==='string'?{nom:t,desc:''}:t;});
  if(!myTours.length){
    el.innerHTML='<div style="font-size:12px;color:var(--t3);padding:4px 0 8px">Aucun tour dans la bibliothèque. Ajoutez-en ci-dessus.</div>';
    return;
  }
  el.innerHTML=myTours.map(function(t,i){
    var hasDesc=t.desc&&t.desc.length>0;
    return'<div style="background:var(--card);border:0.5px solid var(--border);border-radius:var(--radm);margin-bottom:8px;overflow:hidden">'
      +'<div style="display:flex;align-items:center;gap:8px;padding:9px 10px;cursor:pointer" onclick="toggleTourDesc('+i+')">'
      +'<span style="font-size:13px;font-weight:500;color:var(--t);flex:1">'+t.nom+'</span>'
      +(hasDesc?'<span style="font-size:10px;color:var(--t3);letter-spacing:0.05em">note</span>':'')
      +'<span style="font-size:11px;color:var(--t3)" id="tour-arrow-'+i+'">'+(hasDesc?'▾':'▸')+'</span>'
      +'<button onclick="event.stopPropagation();deleteTourLib('+i+')" style="background:none;border:none;color:var(--t3);font-size:16px;cursor:pointer;padding:2px 6px;line-height:1">×</button>'
      +'</div>'
      +'<div id="tour-desc-'+i+'" style="display:'+(hasDesc?'block':'none')+';padding:0 10px 10px;border-top:0.5px solid var(--border)">'
      +'<textarea id="tour-textarea-'+i+'" class="form-textarea" placeholder="Description, mémo, matériel nécessaire..." style="margin-top:8px;font-size:12px;min-height:60px" onblur="saveTourDesc('+i+')" onchange="saveTourDesc('+i+')">'+t.desc+'</textarea>'
      +'</div>'
      +'</div>';
  }).join('');
}

function toggleTourDesc(i){
  var block=document.getElementById('tour-desc-'+i);
  var arrow=document.getElementById('tour-arrow-'+i);
  if(!block)return;
  var open=block.style.display==='block';
  // Fermer tous les autres
  myTours.forEach(function(_,j){
    if(j===i)return;
    var b=document.getElementById('tour-desc-'+j);
    var a=document.getElementById('tour-arrow-'+j);
    if(b)b.style.display='none';
    if(a)a.textContent=myTours[j]&&myTours[j].desc?'▾':'▸';
  });
  block.style.display=open?'none':'block';
  arrow.textContent=open?'▸':'▾';
  if(!open){var ta=document.getElementById('tour-textarea-'+i);if(ta)ta.focus();}
}

function saveTourDesc(i){
  var ta=document.getElementById('tour-textarea-'+i);
  if(!ta)return;
  myTours[i].desc=ta.value;
  saveTours();
  // Mettre à jour l'indicateur "note" sans re-render complet
  var arrow=document.getElementById('tour-arrow-'+i);
  if(arrow)arrow.textContent=ta.value?'▾':'▸';
}

function addTourLib(){
  var inp=document.getElementById('new-tour-input');
  var val=inp.value.trim();
  if(!val)return;
  var exists=myTours.some(function(t){return(typeof t==='object'?t.nom:t)===val;});
  if(!exists){myTours.push({nom:val,desc:''});saveTours();}
  inp.value='';inp.focus();
  renderToursLib();
  // Tout fermer après ajout
  myTours.forEach(function(_,j){
    var b=document.getElementById('tour-desc-'+j);
    if(b)b.style.display='none';
  });
}

function deleteTourLib(i){
  myTours.splice(i,1);saveTours();renderToursLib();
}

function renderCalendar(){
  document.getElementById('cal-label').textContent=MONTHS[calM]+' '+calY;
  var grid=document.getElementById('cal-grid');
  grid.innerHTML=DAYS.map(function(d){return'<div class="cal-dlbl">'+d+'</div>';}).join('');
  var first=new Date(calY,calM,1).getDay();first=(first===0)?6:first-1;
  var dim=new Date(calY,calM+1,0).getDate(),dip=new Date(calY,calM,0).getDate();
  var today=new Date(),evMap={};
  events.forEach(function(e){var d=new Date(e.date);if(d.getFullYear()===calY&&d.getMonth()===calM){if(!evMap[d.getDate()])evMap[d.getDate()]=[];evMap[d.getDate()].push(e);}});
  for(var i=0;i<first;i++)grid.innerHTML+='<div class="cal-day">'+(dip-first+i+1)+'</div>';
  for(var d=1;d<=dim;d++){
    var isT=(today.getDate()===d&&today.getMonth()===calM&&today.getFullYear()===calY);
    var isS=selDay===d,evs=evMap[d]||[];
    var dots=evs.slice(0,3).map(function(e){return'<span style="background:'+typeColor(e.type)+'"></span>';}).join('');
    grid.innerHTML+='<div class="cal-day inm'+(isT?' today':'')+(isS?' sel':'')+'" onclick="selCalDay('+d+')">'+d+(dots?'<span class="dots">'+dots+'</span>':'')+'</div>';
  }
  var rem=42-first-dim;for(var i=1;i<=rem;i++)grid.innerHTML+='<div class="cal-day">'+i+'</div>';
  showCalDay(selDay);
}
function selCalDay(d){selDay=d;renderCalendar();}
function showCalDay(d){
  var el=document.getElementById('cal-events');
  if(!d){el.innerHTML='<div class="cal-empty">Appuyez sur un jour pour voir les prestations</div>';return;}
  var evs=events.filter(function(e){var ev=new Date(e.date);return ev.getFullYear()===calY&&ev.getMonth()===calM&&ev.getDate()===d;});
  if(!evs.length){el.innerHTML='<div class="cal-empty">Aucune prestation ce jour</div>';return;}
  el.innerHTML=evs.map(function(e){return'<div class="cal-ev"><div class="cal-ev-bar" style="background:'+typeColor(e.type)+'"></div><div style="flex:1"><div class="cal-ev-name">'+e.name+'</div><div class="cal-ev-sub">'+typeLabel(e.type)+' · '+e.lieu+' · '+e.duree+'</div></div>'+statusBadge(e.status)+'</div>';}).join('');
}
function prevMonth(){calM--;if(calM<0){calM=11;calY--;}selDay=null;renderCalendar();}
function nextMonth(){calM++;if(calM>11){calM=0;calY++;}selDay=null;renderCalendar();}

function callContact(tel){if(tel)window.location.href='tel:'+tel.replace(/\s/g,'');}

function exportICS(id){
  var e=events.find(function(x){return x.id===id;});if(!e)return;
  var d=new Date(e.date);
  function p(n){return String(n).padStart(2,'0');}
  var ds=d.getFullYear()+''+p(d.getMonth()+1)+''+p(d.getDate());
  var T=TYPES[e.type]||TYPES.autre;
  var desc='Type: '+T.label+'\\nContact: '+e.contact+' - '+e.tel+'\\nDurée: '+e.duree+'\\nNotes: '+e.notes+'\\nAttentes: '+T.attentes.slice(0,2).join(' / ');
  var ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Lucas Magicien//FR\r\nBEGIN:VEVENT\r\nUID:'+id+'@lucasmagicien\r\nDTSTART;VALUE=DATE:'+ds+'\r\nDTEND;VALUE=DATE:'+ds+'\r\nSUMMARY:🎩 '+e.name+' ('+T.label+')\r\nLOCATION:'+e.lieu+'\r\nDESCRIPTION:'+desc+'\r\nEND:VEVENT\r\nEND:VCALENDAR';
  var blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=e.name.replace(/\s+/g,'_')+'.ics';
  document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},600);
}

var selType='mariage';
var modalSetlist=[];

function openModal(){
  selType='mariage';modalSetlist=[];
  document.getElementById('modal-inner').innerHTML='<div class="modal-handle"></div>'
    +'<div class="modal-title">Nouvelle prestation</div>'
    +'<div class="form-group"><label class="form-label">Type d\'événement</label>'
    +'<div class="type-picker">'
    +Object.keys(TYPES).map(function(k){return'<button class="type-opt'+(k==='mariage'?' sel-mariage':'')+'" onclick="pickType(this,\''+k+'\')">'+TYPES[k].label+'</button>';}).join('')
    +'</div></div>'
    +'<div class="form-group"><label class="form-label">Nom de l\'événement</label><input class="form-input" id="f-name" placeholder="Ex: Mariage Dupont"/></div>'
    +'<div class="form-row"><div class="form-group"><label class="form-label">Date</label><input class="form-input" id="f-date" type="date"/></div>'
    +'<div class="form-group"><label class="form-label">Durée</label><input class="form-input" id="f-duree" placeholder="2h"/></div></div>'
    +'<div class="form-group"><label class="form-label">Lieu</label><input class="form-input" id="f-lieu" placeholder="Ville"/></div>'
    +'<div class="form-row"><div class="form-group"><label class="form-label">Contact</label><input class="form-input" id="f-contact" placeholder="Nom"/></div>'
    +'<div class="form-group"><label class="form-label">Téléphone</label><input class="form-input" id="f-tel" type="tel" placeholder="06 xx xx xx xx"/></div></div>'
    +'<div class="form-group"><label class="form-label">Statut</label><select class="form-select" id="f-status"><option value="confirmé">Confirmé</option><option value="option">Option</option></select></div>'
    +'<div class="form-group"><label class="form-label">Notes client</label><textarea class="form-textarea" id="f-notes" placeholder="Attentes, contexte, contraintes..."></textarea></div>'
    +'<div class="form-group"><label class="form-label">Setlist (tours prévus)</label>'
    +(myTours.length
      ? '<select class="form-select" id="f-tour-select" style="margin-bottom:7px"><option value="">— Choisir dans ma bibliothèque —</option>'+myTours.map(function(t){var n=typeof t==='object'?t.nom:t;return'<option value="'+n+'">'+n+'</option>';}).join('')+'</select>'
        +'<div style="display:flex;gap:7px;margin-bottom:8px;align-items:center">'
        +'<button onclick="addTourFromSelect()" style="flex:1;padding:8px;background:var(--gold-bg);border:0.5px solid var(--gold-border);border-radius:var(--radm);color:var(--gold);font-size:12px;font-weight:600;cursor:pointer">+ Ajouter ce tour</button>'
        +'</div>'
        +'<div style="display:flex;gap:7px;margin-bottom:8px"><input class="form-input" id="f-tour" placeholder="Ou saisir un autre tour..." style="flex:1"/>'
        +'<button onclick="addTourToList()" style="padding:0 14px;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radm);color:var(--t2);font-size:18px;cursor:pointer;flex-shrink:0">+</button></div>'
      : '<div style="display:flex;gap:7px;margin-bottom:8px"><input class="form-input" id="f-tour" placeholder="Nom du tour..." style="flex:1"/>'
        +'<button onclick="addTourToList()" style="padding:0 14px;background:var(--gold-bg);border:0.5px solid var(--gold-border);border-radius:var(--radm);color:var(--gold);font-size:18px;cursor:pointer;flex-shrink:0">+</button></div>'
        +'<div style="font-size:11px;color:var(--t3);margin-bottom:8px">Astuce : ajoutez vos tours dans la bibliothèque (Setlists) pour les retrouver ici.</div>'
    )
    +'<div id="setlist-preview" style="display:flex;flex-direction:column;gap:5px"></div></div>'
    +'<button class="modal-submit" onclick="saveEvent()">Enregistrer + Exporter vers Calendrier</button>';
  document.getElementById('modal-ov').classList.add('open');
}

function addTourFromSelect(){
  var sel=document.getElementById('f-tour-select');
  if(!sel||!sel.value)return;
  if(modalSetlist.indexOf(sel.value)===-1){
    modalSetlist.push(sel.value);
    refreshSetlistPreview();
  }
  sel.value='';
}

function addTourToList(){
  var inp=document.getElementById('f-tour');
  var val=inp.value.trim();
  if(!val)return;
  modalSetlist.push(val);
  inp.value='';inp.focus();
  refreshSetlistPreview();
}

function removeTour(i){
  modalSetlist.splice(i,1);
  refreshSetlistPreview();
}

function refreshSetlistPreview(){
  var el=document.getElementById('setlist-preview');
  if(!modalSetlist.length){el.innerHTML='<div style="font-size:12px;color:var(--t3);padding:4px 0">Aucun tour ajouté</div>';return;}
  el.innerHTML=modalSetlist.map(function(t,i){
    return'<div style="display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--bg2);border-radius:var(--radm);font-size:13px;color:var(--t2)">'
      +'<span style="font-size:10px;color:var(--t3);font-weight:600;width:16px">'+(i+1)+'</span>'
      +'<span style="flex:1">'+t+'</span>'
      +'<button onclick="removeTour('+i+')" style="background:none;border:none;color:var(--t3);font-size:16px;cursor:pointer;padding:0;line-height:1">×</button>'
      +'</div>';
  }).join('');
}

function pickType(btn,type){
  selType=type;
  document.querySelectorAll('.type-opt').forEach(function(b){b.className='type-opt';});
  btn.className='type-opt sel-'+type;
}
function overlayClick(e){if(e.target===document.getElementById('modal-ov'))document.getElementById('modal-ov').classList.remove('open');}
function saveEvent(){
  var name=document.getElementById('f-name').value.trim();
  var date=document.getElementById('f-date').value;
  if(!name||!date)return;
  var nev={id:Date.now(),name:name,date:date,type:selType,
    lieu:document.getElementById('f-lieu').value||'À préciser',
    contact:document.getElementById('f-contact').value||'',
    tel:document.getElementById('f-tel').value||'',
    duree:document.getElementById('f-duree').value||'À définir',
    notes:document.getElementById('f-notes').value||'',
    status:document.getElementById('f-status').value,
    setlist:modalSetlist.slice()};
  events.push(nev);save();
  document.getElementById('modal-ov').classList.remove('open');
  exportICS(nev.id);
  renderDashboard();
}

function resetData(){
  if(!confirm('Supprimer toutes les prestations ? (Votre bibliothèque de tours sera conservée)'))return;
  events=[];save();closeNav();renderDashboard();
}

renderDashboard();
</script>
</body>
